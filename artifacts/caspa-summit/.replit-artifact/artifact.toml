kind = "web"
previewPath = "/"
title = "CASPA CEO Summit"
version = "1.0.0"
id = "artifacts/caspa-summit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25529

[services.development]
run = "pnpm --filter @workspace/caspa-summit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caspa-summit", "run", "build" ]
publicDir = "artifacts/caspa-summit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25529"
BASE_PATH = "/"
